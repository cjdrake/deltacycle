line-length = 100

[lint]

# https://docs.astral.sh/ruff/rules
select = [
    "E",    # pycodestyle Error
    "W",    # pycodestyle Warning
    "F",    # Pyflakes
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
]

ignore = []

# Ignore PyLint Refactor/Warning rules for examples and tests
[lint.per-file-ignores]
"{ipynb,tests}/*" = ["PLR", "PLW"]
